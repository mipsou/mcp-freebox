name: Release

# Security: GITHUB_TOKEN is read-only by default (workflow level).
# Jobs that publish assets declare elevated permissions explicitly (least privilege).
# Actions pinned to commit SHAs — supply chain protection (verified via zizmor).
permissions:
  contents: read

on:
  push:
    tags: ['v*']

jobs:
  release:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest

    permissions:
      contents: write   # create GitHub Release + upload assets
      id-token: write   # cosign OIDC keyless signing (Sigstore)

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME}"
          BINARY="freebox-mcp_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}"
          go build -trimpath -ldflags="-s -w" -o "${BINARY}" ./cmd/freebox-mcp
          echo "BINARY=${BINARY}" >> "${GITHUB_ENV}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign binary (keyless — Sigstore)
        # Keyless signing uses the OIDC token (id-token: write) to authenticate
        # against Fulcio CA. The signature + Rekor transparency log entry are
        # written to the .bundle file uploaded alongside the binary.
        run: cosign sign-blob --yes --bundle="${BINARY}.bundle" "${BINARY}"

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Generate SBOM (SPDX-JSON)
        run: syft scan "${BINARY}" -o spdx-json > "${BINARY}.spdx.json"

      - name: Publish assets to GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          generate_release_notes: true
          make_latest: "true"
          files: |
            ${{ env.BINARY }}
            ${{ env.BINARY }}.bundle
            ${{ env.BINARY }}.spdx.json
