name: CI

# Security: GITHUB_TOKEN is read-only by default (workflow level).
# Jobs that need elevated permissions declare them explicitly (least privilege).
# Actions pinned to minor versions — SHA pinning tracked via Dependabot / pinact.
permissions:
  contents: read

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Go
        uses: actions/setup-go@v5.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        # go mod verify checks that downloaded modules match go.sum checksums.
        # Detects tampered or corrupted module caches before any build or test.
        run: go mod verify

      - name: go vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -timeout 60s

      - name: Build
        run: go build -o freebox-mcp.exe ./cmd/freebox-mcp

      - name: govulncheck
        # Pinned to explicit version — @latest is a supply chain risk.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  lint:
    name: golangci-lint
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Go
        uses: actions/setup-go@v5.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6.5.2
        with:
          version: v2.9.0  # first version with Go 1.26 support (released 2026-02-10)
          args: --timeout=3m

  pipeline-security:
    name: Pipeline Security (zizmor + actionlint)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read         # zizmor — fetches action metadata for online audits
      security-events: write # zizmor — uploads SARIF to GitHub Advanced Security tab

    steps:
      - uses: actions/checkout@v4.2.2

      - name: zizmor
        # Static analysis for GitHub Actions workflows.
        # Detects: template injection, unpinned actions, excessive permissions,
        # credential exposure, dangerous action patterns — 30+ audit rules.
        # SHA-pinned (v0.5.3) — zizmor is one of the few actions with SHA examples in docs.
        uses: zizmorcore/zizmor-action@b1d7e1fb5de872772f31590499237e7cce841e8e # v0.5.3
        with:
          advanced-security: false  # requires GitHub Advanced Security (paid) — disabled for private repo
          annotations: true         # findings shown as PR annotations instead
          # persona: pedantic       # uncomment to also flag missing SHA pins

      - name: actionlint
        # Type-checks ${{ }} expressions, validates action inputs/outputs,
        # detects script injection via untrusted inputs, shellcheck on run: steps.
        uses: devops-actions/actionlint@v0.1.11
