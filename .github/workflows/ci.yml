name: CI

# Security: GITHUB_TOKEN is read-only for all jobs.
# Actions are pinned to specific versions to prevent supply chain attacks.
# TODO(hardening): pin each action to a commit SHA with pinact or Dependabot.
permissions:
  contents: read

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Go
        uses: actions/setup-go@v5.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        # go mod verify checks that downloaded modules match go.sum checksums.
        # Detects tampered or corrupted module caches before any build or test.
        run: go mod verify

      - name: go vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -timeout 60s

      - name: Build
        run: go build -o freebox-mcp.exe ./cmd/freebox-mcp

      - name: govulncheck
        # Pinned to explicit version — @latest is a supply chain risk.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  lint:
    name: golangci-lint
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Go
        uses: actions/setup-go@v5.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6.5.2
        with:
          version: v1.64.8
          args: --timeout=3m
