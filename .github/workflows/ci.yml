name: CI

# Security: GITHUB_TOKEN is read-only by default (workflow level).
# Jobs that need elevated permissions declare them explicitly (least privilege).
# Actions pinned to commit SHAs — supply chain protection (verified via zizmor).
permissions:
  contents: read

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        # go mod verify checks that downloaded modules match go.sum checksums.
        # Detects tampered or corrupted module caches before any build or test.
        run: go mod verify

      - name: go vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -timeout 60s

      - name: Build
        run: go build -o freebox-mcp.exe ./cmd/freebox-mcp

      - name: govulncheck
        # Pinned to explicit version — @latest is a supply chain risk.
        # Temporary exclusions (go1.26.3 fixes them, not yet in GHA CDN — track actions/go-versions):
        #   GO-2026-4971: panic in net.Dial/LookupPort on NUL byte (Windows)
        #   GO-2026-4918: infinite loop in HTTP/2 SETTINGS_MAX_FRAME_SIZE
        # Remove exclusions and bump go.mod to 1.26.3 once available.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          $out = govulncheck ./... 2>&1
          $code = $LASTEXITCODE
          if ($code -eq 0) { Write-Host ($out -join "`n"); exit 0 }
          $excluded = @("GO-2026-4971", "GO-2026-4918")
          $found = [regex]::Matches(($out -join "`n"), 'Vulnerability #\d+: (GO-[0-9-]+)') |
                   ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          $critical = $found | Where-Object { $_ -notin $excluded }
          Write-Host ($out -join "`n")
          if ($critical) { Write-Error "Unignored CVEs: $($critical -join ', ')"; exit 1 }
          Write-Host "WARNING: only temporarily excluded CVEs ($($found -join ', ')). Remove once go1.26.3 is in GHA CDN."
          exit 0

  lint:
    name: golangci-lint
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.9.0  # first version with Go 1.26 support (released 2026-02-10)
          args: --timeout=3m

  pipeline-security:
    name: Pipeline Security (zizmor + actionlint)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read         # zizmor — fetches action metadata for online audits
      security-events: write # zizmor — uploads SARIF to GitHub Advanced Security tab

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: zizmor
        # Static analysis for GitHub Actions workflows.
        # Detects: template injection, unpinned actions, excessive permissions,
        # credential exposure, dangerous action patterns — 30+ audit rules.
        # SHA-pinned (v0.5.3) — zizmor is one of the few actions with SHA examples in docs.
        uses: zizmorcore/zizmor-action@b1d7e1fb5de872772f31590499237e7cce841e8e # v0.5.3
        with:
          advanced-security: false  # requires GitHub Advanced Security (paid) — disabled for private repo
          annotations: true         # findings shown as PR annotations instead
          # persona: pedantic       # uncomment to also flag missing SHA pins

      - name: actionlint
        # Type-checks ${{ }} expressions, validates action inputs/outputs,
        # detects script injection via untrusted inputs, shellcheck on run: steps.
        uses: devops-actions/actionlint@469810fd82c015d3c43815cd2b0e4d02eecc4819 # v0.1.11
